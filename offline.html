<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060b" />
<title>LAST NIGHT — offline</title>
<!-- Everything inline on purpose: this page has to paint with no cache behind
     it and no network in front of it. -->
<style>
  :root { color-scheme: dark; }
  @font-face { font-family: "Special Elite"; src: url("./assets/fonts/special-elite-latin-400-normal.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #05060b; color: #e6e1d2;
    font-family: "Special Elite", "Courier New", monospace;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 32px; text-align: center;
  }
  .ring { width: 112px; height: 112px; opacity: 0.95; }
  h1 {
    margin: 0; font-size: 26px; font-weight: 400;
    letter-spacing: 0.34em; text-indent: 0.34em; text-transform: uppercase;
  }
  p {
    margin: 0; max-width: 30ch; font-size: 15px; line-height: 1.65;
    color: rgba(230,225,210,0.70);
  }
  button {
    margin-top: 6px; padding: 13px 30px;
    font: inherit; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #e6e1d2; background: transparent;
    border: 1px solid rgba(168,131,60,0.55); border-radius: 2px;
    cursor: pointer;
  }
  button:active { background: rgba(168,131,60,0.14); }
  a { color: rgba(168,131,60,0.9); }
</style>
</head>
<body>
  <!-- the brand mark, inlined so it cannot fail to load -->
  <svg class="ring" viewBox="0 0 64 64" role="img" aria-label="LAST NIGHT">
    <rect width="64" height="64" fill="#05060b"/>
    <circle cx="32" cy="32" r="27.5" fill="none" stroke="#a8833c" stroke-width="1.25"/>
    <path d="M40.2 13.2a5.2 5.2 0 1 0 0 7.2 3.8 3.8 0 1 1 0-7.2z" fill="#cfc6b0"/>
    <path d="M21 47V29.5c0-6.1 4.9-11 11-11s11 4.9 11 11V47" fill="none" stroke="#e6e1d2" stroke-width="1.6"/>
    <path d="M27.2 31.2h9.6v9.2h-9.6z" fill="#1a120c"/>
    <path d="M29.2 33h5.6v5.4h-5.6z" fill="#ffb257"/>
    <path d="M32 47.4l-1.7 5.2h3.4z" fill="#7d1220"/>
  </svg>

  <h1>Last Night</h1>
  <p>The house is not on this phone yet. Connect once and it will stay — every
     night after that loads without asking.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
