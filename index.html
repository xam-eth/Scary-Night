<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" aria-label="DUSKHOLD game. Controls: move with WASD or arrow keys, attack with F, dash with Shift, interact with E, repair with R, barricade with B, change weapon with Q, and pause with Escape."></canvas>

  <div id="veil">

      <img class="veil-photo" src="./assets/brand/loading-9x16.jpg" width="1080" height="1920" alt="DUSKHOLD loading artwork" />

    </div>
  </div>

  <a id="privacy-link" href="./privacy.html">Privacy</a>

  <button id="fullscreen" title="Fullscreen" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

  <noscript>
    <div style="color:#c8bfa8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:2rem;text-align:center">
      DUSKHOLD needs JavaScript.
      <a href="./privacy.html">Privacy policy</a> · <a href="./delete.html">Delete my data</a>
    </div>
  </noscript>

  <script type="module" src="./src/main.js"></script>
  <!-- The service worker, only where it means something. On http (localhost,
       the preview server) it is not registered at all: a cached module graph
       would hide every edit during development. -->
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* a PWA is a bonus, never a requirement */ });
      });
    }
  </script>
</body>
