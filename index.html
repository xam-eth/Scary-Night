<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="LAST NIGHT — survive until dawn. A 3/4 vampire survival horror game about tension, doors and the sound of knocking." />
<title>LAST NIGHT — Survive until dawn.</title>
<link rel="stylesheet" href="./styles.css" />
<!-- The player IS this GLB — fetched as the original bytes, straight into GLTFLoader. -->
<link rel="preload" as="fetch" crossorigin="anonymous" href="./hunter_run_walk_claw_sword_shot.glb" />
<link rel="preload" as="fetch" crossorigin="anonymous" href="./zombie+3d+model.glb" />
<link rel="icon" href="./assets/brand/mark.svg" type="image/svg+xml" />
<link rel="manifest" href="./manifest.webmanifest" />
<!-- Play Billing in a Trusted Web Activity needs the Digital Goods API, and
     the Digital Goods API ships as an origin trial. Register the token for
     THIS origin at https://developer.chrome.com/origintrials (Digital Goods
     API v2) and paste it below; without it the Play shop falls back to the
     shard lane and takes no money. Tokens expire — put the date in the
     release calendar.
<meta http-equiv="origin-trial" content="PASTE_YOUR_DIGITAL_GOODS_API_V2_TOKEN" />
-->
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" aria-label="Last Night game canvas"></canvas>
  </div>

  <div id="veil">
    <div class="veil-frame">
      <img class="veil-photo" src="./assets/brand/loading-9x16.jpg" width="768" height="1365" alt="LAST NIGHT" />
      <div class="veil-bar"><span></span></div>
    </div>
  </div>

  <a id="privacy-link" href="./privacy.html">Privacy</a>

  <button id="fullscreen" title="Fullscreen" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <noscript>
    <div style="color:#c8bfa8;font-family:Georgia,serif;padding:2rem;text-align:center">
      LAST NIGHT needs JavaScript.
      <a href="./privacy.html">Privacy policy</a> · <a href="./delete.html">Delete my data</a>
    </div>
  </noscript>

  <script type="module" src="./src/main.js"></script>
  <!-- The service worker, only where it means something. On http (localhost,
       the preview server) it is not registered at all: a cached module graph
       would hide every edit during development. -->
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* a PWA is a bonus, never a requirement */ });
      });
    }
  </script>
</body>
</html>
