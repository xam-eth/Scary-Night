<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LAST NIGHT — brand kit</title>
<style>
  :root {
    --ink: #05060b; --bone: #e6e1d2; --ash: #cfc6b0;
    --blood: #7d1220; --gold: #a8833c; --candle: #ffb257; --moon: #8fb6e8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--ash); font-family: Georgia, "Palatino Linotype", serif; }
  header, section { padding: 36px 6vw; }
  h1 { font-weight: 400; letter-spacing: 0.18em; font-size: clamp(32px, 6vw, 64px); color: var(--bone); margin: 12px 0 0; }
  h2 { font-weight: 400; letter-spacing: 0.16em; font-size: 13px; color: var(--gold); }
  p { max-width: 62ch; line-height: 1.55; }
  .mark { width: 72px; height: 72px; }
  .rule { width: 140px; height: 1px; background: var(--gold); margin: 14px 0; }
  .tag { letter-spacing: 0.32em; font: 11px/1 "Segoe UI", Roboto, sans-serif; color: var(--gold); }
  .phones { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .phone {
    width: min(280px, 70vw);
    aspect-ratio: 9 / 16;
    background: #000 center/cover no-repeat;
    border: 1px solid rgba(168,131,60,0.45);
    position: relative;
    overflow: hidden;
  }
  .phone img.plate { width: 100%; height: 100%; object-fit: cover; display: block; }
  .phone figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 12px 16px;
    background: linear-gradient(transparent, rgba(5,6,11,0.88));
    text-align: center; color: var(--bone); letter-spacing: 0.14em; font-size: 13px;
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; }
  .swatch { width: 120px; background: #0c0e14; border: 1px solid rgba(168,131,60,0.35); }
  .swatch i { display: block; height: 56px; }
  .swatch b, .swatch span { display: block; padding: 8px 10px 0; font: 12px/1.3 "Segoe UI", Roboto, sans-serif; }
  .swatch span { padding-bottom: 10px; color: rgba(207,198,176,0.7); }
</style>
</head>
<body>
  <header>
    <img class="mark" src="../assets/brand/mark.svg" alt="" />
    <h1>LAST NIGHT</h1>
    <div class="rule"></div>
    <div class="tag">SURVIVE UNTIL DAWN</div>
    <p>Mobile first. The loading plate and the menu plate already carry the door mark and the wordmark. Do not paint a second title on top of them.</p>
  </header>
  <section>
    <h2>PLATES · 768 × 1365</h2>
    <div class="phones">
      <figure class="phone">
        <img class="plate" src="../assets/brand/loading-9x16.jpg" alt="Loading plate with the LAST NIGHT wordmark and door mark" />
      </figure>
      <figure class="phone">
        <img class="plate" src="../assets/brand/menu-9x16.jpg" alt="Menu plate with the LAST NIGHT wordmark and door mark" />
      </figure>
    </div>
  </section>
  <section>
    <h2>COLOUR</h2>
    <div class="swatches">
      <div class="swatch"><i style="background:#05060b"></i><b>Ink</b><span>#05060b</span></div>
      <div class="swatch"><i style="background:#e6e1d2"></i><b>Bone</b><span>#e6e1d2</span></div>
      <div class="swatch"><i style="background:#cfc6b0"></i><b>Ash</b><span>#cfc6b0</span></div>
      <div class="swatch"><i style="background:#7d1220"></i><b>Blood</b><span>#7d1220</span></div>
      <div class="swatch"><i style="background:#a8833c"></i><b>Gold</b><span>#a8833c</span></div>
      <div class="swatch"><i style="background:#ffb257"></i><b>Candle</b><span>#ffb257</span></div>
      <div class="swatch"><i style="background:#8fb6e8"></i><b>Moon</b><span>#8fb6e8</span></div>
    </div>
  </section>
</body>
</html>
