<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>img2threejs review harness (DUSKHOLD tools)</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
// Review renders for img2threejs factories (tools/img2threejs-render.mjs drives this page).
// Lighting follows the game renderer (src/game/envkit.js): ACES Filmic, exposure ~1.25,
// hemisphere + key + fill, no environment map — so a review render predicts the in-game look.
import * as THREE from '/src/vendor/three/three.module.min.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

function lights(scene, radius) {
  const hemi = new THREE.HemisphereLight(0xf2f4ff, 0x4a4036, 1.35);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff1e0, 2.3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  const s = radius * 2.2;
  Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.1, far: radius * 20 });
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.01 * radius;
  key.shadow.radius = 4;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xd8e2ff, 0.55);
  scene.add(fill);
  // light modes (the img2threejs lighting pass asks for neutral, grazing and reference-matched checks)
  const modes = {
    neutral: () => { hemi.intensity = 1.35; key.color.set(0xfff1e0); key.intensity = 2.3; key.position.set(-3, 5, 4).multiplyScalar(radius); fill.intensity = 0.55; fill.position.set(4, 2, 2).multiplyScalar(radius); },
    grazing: () => { hemi.intensity = 0.35; key.color.set(0xfff4e8); key.intensity = 3.6; key.position.set(6, 0.9, 2.2).multiplyScalar(radius); fill.intensity = 0.12; fill.position.set(-4, 2, 2).multiplyScalar(radius); },
    // studio: a concept-art product light (soft overhead key, low ambient so the space under a table top
    // falls into deep occlusion, a frontal fill from the camera's right), for assets whose reference was
    // lit that way (render-options.json fixedLight: 'studio')
    studio: () => { hemi.intensity = 0.75; key.color.set(0xfff4e6); key.intensity = 3.1; key.position.set(-1.5, 7, 3.5).multiplyScalar(radius); fill.intensity = 0.9; fill.position.set(3.5, 2.5, 4.5).multiplyScalar(radius); },
    reference: () => { hemi.intensity = 1.1; key.color.set(0xffe2b8); key.intensity = 2.6; key.position.set(-4.5, 6.5, 5).multiplyScalar(radius); fill.intensity = 0.45; fill.position.set(5, 2.5, 1).multiplyScalar(radius); },
  };
  return (mode) => (modes[mode] || modes.neutral)();
}

function projectedBox(object, camera) {
  const v = new THREE.Vector3();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  object.updateMatrixWorld(true);
  object.traverse((o) => {
    if (!o.isMesh || !o.visible || !o.geometry || !o.geometry.attributes.position) return;
    const pos = o.geometry.attributes.position;
    const step = Math.max(1, Math.floor(pos.count / 400));
    const mats = [];
    if (o.isInstancedMesh) {
      const m = new THREE.Matrix4();
      for (let i = 0; i < o.count; i++) { o.getMatrixAt(i, m); mats.push(new THREE.Matrix4().multiplyMatrices(o.matrixWorld, m)); }
    } else mats.push(o.matrixWorld);
    for (const mw of mats) {
      for (let i = 0; i < pos.count; i += step) {
        v.fromBufferAttribute(pos, i).applyMatrix4(mw).project(camera);
        minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
      }
    }
  });
  return { minX, minY, maxX, maxY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, w: maxX - minX, h: maxY - minY };
}

function stats(model) {
  let meshes = 0, instanced = 0, triangles = 0;
  const materials = new Set();
  model.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    const tris = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    if (o.isInstancedMesh) { instanced++; triangles += tris * o.count; } else { meshes++; triangles += tris; }
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => materials.add(m.uuid));
  });
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  return { meshes, instanced, drawCalls: meshes + instanced, triangles: Math.round(triangles), materials: materials.size,
    bbox: { min: box.min.toArray().map((x) => +x.toFixed(4)), max: box.max.toArray().map((x) => +x.toFixed(4)), size: size.toArray().map((x) => +x.toFixed(4)) } };
}

function exportMeshes(model) {
  const out = [];
  const v = new THREE.Vector3();
  model.updateMatrixWorld(true);
  model.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh) return;
    const g = o.geometry;
    const pos = g.attributes.position;
    const vertices = [];
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld); vertices.push([+v.x.toFixed(5), +v.y.toFixed(5), +v.z.toFixed(5)]); }
    // world-space vertex normals: self_intersection.py steps outward along them (its centroid
    // fallback points INTO a torus' tube on the ring's inner side)
    let normals;
    if (g.attributes.normal) {
      const nm = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);
      const nv = new THREE.Vector3();
      normals = [];
      for (let i = 0; i < pos.count; i++) { nv.fromBufferAttribute(g.attributes.normal, i).applyMatrix3(nm).normalize(); normals.push([+nv.x.toFixed(4), +nv.y.toFixed(4), +nv.z.toFixed(4)]); }
    }
    let indices;
    if (g.index) indices = Array.from(g.index.array);
    else { indices = []; for (let i = 0; i < pos.count; i++) indices.push(i); }
    out.push(normals ? { id: o.name, name: o.name, vertices, indices, normals } : { id: o.name, name: o.name, vertices, indices });
  });
  return out;
}

// the part tree for check_part_coverage.py (img2threejs assembly gate)
function partsManifest(model) {
  const parts = [];
  let unnamed = 0;
  const rt = model.userData.sculptRuntime || {};
  const byMesh = new Map(Object.entries(rt.meshes || {}).map(([id, m]) => [m, id]));
  model.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    const tris = (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1);
    if (!o.name) { unnamed++; return; }
    parts.push({ name: o.name, kind: o.isInstancedMesh ? 'instanced-part' : 'part', module: byMesh.get(o) || o.name, triangles: Math.round(tris) });
  });
  return { model: model.name, parts, unnamedMeshes: unnamed, integralMeshes: 0 };
}

function nodePositions(model) {
  const out = {};
  const rt = model.userData && model.userData.sculptRuntime;
  if (!rt || !rt.nodes) return out;
  const v = new THREE.Vector3();
  model.updateMatrixWorld(true);
  for (const [id, node] of Object.entries(rt.nodes)) { node.getWorldPosition(v); out[id] = [+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4)]; }
  return out;
}

window.renderModel = async (opts) => {
  const mod = await import(opts.moduleUrl);
  const factory = mod[opts.exportName];
  if (typeof factory !== 'function') throw new Error(`no export ${opts.exportName}`);
  const model = factory(Object.assign({ textureSize: 256, qualityPriority: 'balanced' }, opts.buildOptions || {}));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(opts.bg || '#c9c9c9');
  scene.add(model);
  const info = stats(model);
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(0.05, box.getSize(new THREE.Vector3()).length() / 2);
  const setLight = lights(scene, radius);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(radius * 20, radius * 20), new THREE.ShadowMaterial({ opacity: opts.shadowOpacity ?? 0.14 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = box.min.y + 0.0005;
  ground.receiveShadow = true;
  scene.add(ground);
  // optional contact shadow (opts.contactShadow = opacity, or { opacity, falloff, blur }): the
  // studio-floor shadow a concept render has under its subject. Built like an ambient-occlusion
  // decal: a top-down orthographic pass writes, per floor texel, how close the lowest geometry
  // above it is to the floor (max blending, 1 at the floor -> 0 at falloff x model height), the
  // result is blurred and used as the alpha of a black floor plane. No light is involved, so the
  // model's own lighting and key-light self-shadowing are unchanged.
  let decal = null;
  const cso = typeof opts.contactShadow === 'object' && opts.contactShadow ? opts.contactShadow : { opacity: Number(opts.contactShadow || 0) };
  if (cso.opacity > 0) {
    const size = box.getSize(new THREE.Vector3());
    const pad = Math.max(size.x, size.z) * 0.18;
    const w = size.x + pad * 2, d = size.z + pad * 2;
    const ortho = new THREE.OrthographicCamera(-w / 2, w / 2, d / 2, -d / 2, 0.001, size.y * 4 + 1);
    ortho.up.set(0, 0, -1);
    ortho.position.set(center.x, box.max.y + size.y + 0.5, center.z);
    ortho.lookAt(center.x, box.min.y, center.z);
    ortho.updateMatrixWorld(true);
    const H = size.y * (cso.falloff || 1.4);
    const aoMat = new THREE.ShaderMaterial({
      uniforms: { groundY: { value: box.min.y }, H: { value: H } },
      vertexShader: 'varying float vY; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vY = wp.y; gl_Position = projectionMatrix * viewMatrix * wp; }',
      fragmentShader: 'uniform float groundY; uniform float H; varying float vY; void main() { float k = clamp(1.0 - (vY - groundY) / H, 0.0, 1.0); gl_FragColor = vec4(vec3(k * k), 1.0); }',
      depthTest: false, depthWrite: false, side: THREE.DoubleSide,
      blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    });
    const N = 256;
    const rt = new THREE.WebGLRenderTarget(N, N);
    const prevBg = scene.background, prevTm = renderer.toneMapping, prevCs = renderer.outputColorSpace;
    scene.background = null; scene.overrideMaterial = aoMat; ground.visible = false;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear();
    renderer.render(scene, ortho);
    const buf = new Uint8Array(N * N * 4);
    renderer.readRenderTargetPixels(rt, 0, 0, N, N, buf);
    renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 0);
    scene.background = prevBg; scene.overrideMaterial = null; ground.visible = true;
    renderer.toneMapping = prevTm; renderer.outputColorSpace = prevCs;
    rt.dispose(); aoMat.dispose();
    const c0 = document.createElement('canvas'); c0.width = c0.height = N;
    c0.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf.buffer), N, N), 0, 0);
    const c1 = document.createElement('canvas'); c1.width = c1.height = N;
    const g1 = c1.getContext('2d');
    g1.filter = `blur(${(cso.blur || 0.07) * N}px)`;
    g1.drawImage(c0, 0, 0);
    const tex = new THREE.CanvasTexture(c1);
    tex.flipY = false; // readRenderTargetPixels row 0 = screen bottom = world +z = plane v 0
    decal = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: cso.opacity, alphaMap: tex, depthWrite: false, toneMapped: false }));
    decal.rotation.x = -Math.PI / 2;
    decal.position.set(center.x, box.min.y + 0.001, center.z);
    decal.renderOrder = -1;
    scene.add(decal);
  }
  // the floor shadow belongs to the reference-matched views (fixed*, posed-fixed, camera-fit
  // candidates); orbit views stay shadow-free so the multi-angle gates measure only the model
  const renderShot = (camera, viewId) => {
    if (decal) decal.visible = /^(fixed|posed-fixed|c\d)/.test(viewId);
    renderer.render(scene, camera);
  };
  model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  renderer.toneMappingExposure = opts.exposure ?? 1.25;
  const shots = {};
  const framing = {};
  // map-stripped "clay" materials for the blockout's silhouette-without-materials evidence
  const originals = new Map();
  const clay = new THREE.MeshStandardMaterial({ color: 0xb07a52, roughness: 0.85, metalness: 0 }); // saturated clay: always separable from the grey plate
  // optional pose: proves the action-ready pivots work (interaction pass); applied before the views
  // that ask for it and undone after: [{ node, translate: [x,y,z], rotate: [x,y,z] }] on sculptRuntime nodes
  const rtNodes = (model.userData.sculptRuntime && model.userData.sculptRuntime.nodes) || {};
  const applyPose = (pose, sign) => {
    for (const step of pose || []) {
      const n = rtNodes[step.node];
      if (!n) continue;
      if (step.translate) n.position.add(new THREE.Vector3(...step.translate).multiplyScalar(sign));
      if (step.rotate) { n.rotation.x += sign * step.rotate[0]; n.rotation.y += sign * step.rotate[1]; n.rotation.z += sign * step.rotate[2]; }
    }
    model.updateMatrixWorld(true);
  };
  const setClay = (on) => model.traverse((o) => {
    if (!o.isMesh) return;
    if (on) { if (!originals.has(o)) originals.set(o, o.material); o.material = clay; }
    else if (originals.has(o)) o.material = originals.get(o);
  });
  for (const view of opts.views) {
    renderer.setSize(view.width, view.height, false);
    renderer.domElement.style.width = `${view.width}px`;
    renderer.domElement.style.height = `${view.height}px`;
    setLight(view.light || 'neutral');
    let subject = model, subjectCenter = center;
    if (view.focus) {
      const f = model.getObjectByName(view.focus);
      if (f) { subject = f; subjectCenter = new THREE.Box3().setFromObject(f).getCenter(new THREE.Vector3()); }
    }
    const camera = new THREE.PerspectiveCamera(view.fov || 30, view.width / view.height, radius * 0.01, radius * 100);
    const az = THREE.MathUtils.degToRad(view.azimuthDeg || 0);
    const el = THREE.MathUtils.degToRad(view.elevationDeg || 0);
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    let distance = radius / Math.tan(THREE.MathUtils.degToRad((view.fov || 30) / 2)) * 1.05;
    const margin = (view.frame && view.frame.margin) || 1.25;
    const target = view.frame && view.frame.mode === 'match' ? view.frame : { cx: 0, cy: 0, h: 2 / margin, w: 2 / margin };
    let off = { x: 0, y: 0 };
    for (let it = 0; it < 6; it++) {
      camera.position.copy(subjectCenter).addScaledVector(dir, distance);
      camera.lookAt(subjectCenter);
      camera.clearViewOffset();
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld(true);
      const pb = projectedBox(subject, camera);
      // fit the larger of the two ratios so neither width nor height overflows the target box
      const ratio = target.w ? Math.max(pb.h / target.h, pb.w / target.w) : pb.h / target.h;
      distance *= ratio;
      off = { x: (pb.cx / ratio - target.cx) * view.width / 2, y: -(pb.cy / ratio - target.cy) * view.height / 2 };
    }
    camera.position.copy(subjectCenter).addScaledVector(dir, distance);
    camera.lookAt(subjectCenter);
    camera.setViewOffset(view.width, view.height, off.x, off.y, view.width, view.height);
    camera.updateProjectionMatrix();
    setClay(!!view.clay);
    applyPose(view.pose, 1);
    renderShot(camera, view.id);
    shots[view.id] = renderer.domElement.toDataURL('image/png');
    applyPose(view.pose, -1);
    setClay(false);
    const pb = projectedBox(model, camera);
    framing[view.id] = { azimuthDeg: view.azimuthDeg, elevationDeg: view.elevationDeg, fov: view.fov || 30, distance: +distance.toFixed(4),
      bboxNdc: { cx: +pb.cx.toFixed(4), cy: +pb.cy.toFixed(4), w: +pb.w.toFixed(4), h: +pb.h.toFixed(4) } };
  }
  return { shots, info, framing, meshes: opts.exportMeshes ? exportMeshes(model) : null, nodes: nodePositions(model), parts: partsManifest(model) };
};
window.harnessReady = true;
</script>
</body>
</html>
