plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zyvrolabs.duskhold.device'
    compileSdk 35
    // use the SDK the owner already installed (sdkmanager build-tools;35.0.1)
    buildToolsVersion '35.0.1'

    defaultConfig {
        // .device suffix: sideloadable next to the Play build (com.zyvrolabs.duskhold)
        applicationId 'com.zyvrolabs.duskhold.device'
        minSdk 23
        targetSdk 35
        versionCode 27
        versionName '27'
    }

    // Belt for the kotlin-stdlib split (see the bom above): force every
    // kotlin-stdlib artifact to ONE version whatever any androidx pin says,
    // so checkDebugDuplicateClasses can never see 1.6.21 jars next to 1.8.x.
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minify false
        }
    }
}

dependencies {
    // Kotlin stdlib alignment: since Kotlin 1.8 the jdk7/jdk8 classes live IN
    // kotlin-stdlib, but old androidx pins still drag the separate
    // kotlin-stdlib-jdk7/jdk8:1.6.21 jars onto the classpath -> AGP's
    // checkDebugDuplicateClasses fails. The bom forces every kotlin-stdlib
    // artifact to one version (the jdk7/jdk8 ones become empty placeholders).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewAssetLoader: serves the bundled game over a virtual https origin
    // so ES modules, fetch() and WebGL all behave like on a real host.
    implementation 'androidx.webkit:webkit:1.11.0'
}
